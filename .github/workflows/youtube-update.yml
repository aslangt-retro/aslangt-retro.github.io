name: Päivitä YouTube-tilastot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hae tuoreet tiedot YouTubesta
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-youtube.mjs


   
      - name: Tallenna muuttuneet tiedot
        run: |
          if ! git diff --quiet -- data/channel.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/channel.json
            git commit -m "Päivitä YouTube-tiedot"

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
